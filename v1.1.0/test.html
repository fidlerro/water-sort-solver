        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js" integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+" crossorigin="anonymous"></script>
        <script type="text/javascript" src="https://ajax.aspnetcdn.com/ajax/knockout/knockout-3.5.0.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/4.5.0/fabric.min.js"></script>

        <script>
            var canvas = new fabric.Canvas('imageCanvas');
            var imageObject;
            var cropRect;
            var isLocked = false;
            var lockIcon;
            var lockIconSvg = 'M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2m3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2';

            // Function to load an image onto the canvas
            function loadImage(url) {
                fabric.Image.fromURL(url, function(oImg) {
                    // Calculate the scaling factor to fit the image within the canvas while maintaining aspect ratio
                    var scale = Math.min(canvas.width / oImg.width, canvas.height / oImg.height);
                    oImg.crossOrigin = 'anonymous'; // Example property setting
                    oImg.set({
                        scaleX: scale,
                        scaleY: scale,
                        top: canvas.height / 2,
                        left: canvas.width / 2,
                        originX: 'center',
                        originY: 'center',
                        selectable: false,
                        evented: false,
                    });
                    canvas.clear();
                    canvas.add(oImg);
                    canvas.centerObject(oImg);
                    imageObject = oImg;
                    addCropRect();
                    canvas.renderAll();
                });
            }

            function toggleLock() {
                isLocked = !isLocked;
                cropRect.set({
                    selectable: !isLocked,
                    evented: !isLocked,
                });

                if (isLocked) {
                    if (!lockIcon) {
                        // Load lock icon and add it to the canvas
                        fabric.Image.fromURL('images/lock.png', function(img) {
                            lockIcon = img.set({
                                left: cropRect.left + cropRect.width / 2,
                                top: cropRect.top + cropRect.height / 2,
                                scaleX: 0.5,
                                scaleY: 0.5,
                                originX: 'center',
                                originY: 'center',
                                selectable: false,
                                evented: false,
                            });
                            canvas.add(lockIcon);
                            canvas.bringToFront(lockIcon);
                        });
                    } else {
                        // Adjust lock icon position and make it visible
                        lockIcon.set({ visible: true });
                        updateLockIconPosition();
                    }
                } else {
                    if (lockIcon) {
                        lockIcon.visible = false; // Hide lock icon
                    }
                }
                canvas.renderAll();
            }

            function updateLockIconPosition() {
                if (lockIcon && isLocked) {
                    var scaleX = cropRect.scaleX || 1;
                    var scaleY = cropRect.scaleY || 1;
                    
                    lockIcon.set({
                        left: cropRect.left + (cropRect.width * scaleX) / 2,
                        top: cropRect.top + (cropRect.height * scaleY) / 2,
                    });
                    lockIcon.setCoords(); // Update the lock icon's coordinates in the fabric.js canvas
                    canvas.renderAll();
                }
            }

            function addCropRect() {
                cropRect = new fabric.Rect({
                    left: 100,
                    top: 100,
                    width: 200,
                    height: 200,
                    fill: 'rgba(255,255,255,0.3)',
                    stroke: 'red',
                    strokeWidth: 2,
                    lockRotation: true,
                    cornerStyle: 'circle',
                    transparentCorners: false,
                    cornerColor: 'blue',
                    borderColor: 'red',
                });
                canvas.on('mouse:dblclick', function(event) {
                    var clickedObject = event.target;
                    if (cropRect.containsPoint(canvas.getPointer(event.e))) {
                        toggleLock();
                    }
                });
                // Update the lock icon position after the cropRect is moved or scaled
                cropRect.on('object:modified', function() {
                    updateLockIconPosition();
                });

                // Optional: If you want the lock icon to follow the cropRect in real-time as it's being moved or scaled,
                // you can also listen to the 'object:moving' and 'object:scaling' events.
                cropRect.on('object:moving', updateLockIconPosition);
                cropRect.on('object:scaling', updateLockIconPosition);
                canvas.add(cropRect);
                canvas.setActiveObject(cropRect);
            }

            // Event listener for the image loader
            document.getElementById('imageLoader').addEventListener('change', function(e) {
                var reader = new FileReader();
                reader.onload = function(event) {
                    loadImage(event.target.result);
                };
                reader.readAsDataURL(e.target.files[0]);
            });

            loadImage("images/sample-screenshot.png");

        </script>
